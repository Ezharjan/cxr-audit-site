# Routine API capacity limit and access log without query strings or credentials.
limit_req_zone $binary_remote_addr zone=primer_agent_api:10m rate=10r/s;
log_format primer_agent_api '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

# ================================
# Nginx — Reverse proxy for PRIMER-LLM
# HTTP → HTTPS redirect + proxy to Django (Gunicorn)
# ================================

# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name _;

    # ── TLS Certificates ──────────────────────────────────────
    # Mount your real certs here, or use the self-signed ones
    # generated by generate-certs.sh for development
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # ── TLS Hardening ─────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security Headers ──────────────────────────────────────
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; base-uri 'self';" always;

    # ── Request Limits ────────────────────────────────────────
    client_max_body_size 50M;   # for file uploads

    # ── Proxy to Django (Gunicorn) ────────────────────────────
    location /api/ {
        limit_req zone=primer_agent_api burst=20 nodelay;
        limit_req_status 429;
        access_log /var/log/nginx/access.log primer_agent_api;
        error_page 429 = @api_rate_limited;
        error_page 413 = @api_too_large;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $django_upstream http://django:8000;
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 110s;
        proxy_connect_timeout 10s;
    }
    location @api_rate_limited {
        default_type application/json;
        add_header Retry-After 5 always;
        add_header Cache-Control no-store always;
        return 429 '{"error":{"code":"rate_limited","message":"rate limited"}}';
    }
    location @api_too_large {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 413 '{"error":{"code":"upload_too_large","message":"upload too large"}}';
    }

    location / {
        # Resolve the `django` service name at request time via Docker's
        # embedded DNS (127.0.0.11) instead of once at startup. Using a
        # variable in proxy_pass forces runtime resolution, so nginx tracks
        # django's current IP across container restarts/recreations and
        # avoids stale-upstream 502s.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $django_upstream http://django:8000;
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout for LLM processing (polling endpoints)
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # ── Error pages ───────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
